<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - XSHOP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .orders-section {
      margin: 40px 0;
    }
    .order-card {
      background: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .order-id {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-dark);
    }
    .order-date {
      font-size: 14px;
      color: var(--text-light);
    }
    .order-status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .order-status.delivered {
      background: var(--success-color);
      color: var(--bg-white);
    }
    .order-status.pending {
      background: var(--secondary-color);
      color: var(--text-dark);
    }
    .order-status.processing {
      background: var(--primary-color);
      color: var(--bg-white);
    }
    .order-items {
      margin-bottom: 20px;
    }
    .order-item {
      display: flex;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .order-item:last-child {
      border-bottom: none;
    }
    .order-item-image {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }
    .order-item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }
    .order-item-details {
      flex: 1;
    }
    .order-item-name {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 4px;
      color: var(--text-dark);
    }
    .order-item-brand {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .order-item-quantity {
      font-size: 14px;
      color: var(--text-light);
    }
    .order-item-price {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-dark);
    }
    .order-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 2px solid var(--border-color);
    }
    .order-total {
      font-size: 20px;
      font-weight: bold;
      color: var(--text-dark);
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <main>
    <section class="orders-section">
      <div class="container">
        <h2 class="section-title" style="text-align: left;">My Orders</h2>
        <div id="orders-container">
          <!-- Orders will be loaded dynamically -->
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="js/pages/orders.js"></script>
</body>
</html>
