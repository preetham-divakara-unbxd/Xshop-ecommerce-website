<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - XSHOP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .checkout-section {
      margin: 40px 0;
    }
    .checkout-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 40px;
    }
    .checkout-form {
      background: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
    }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--primary-color);
    }
    .order-summary {
      background: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      height: fit-content;
      position: sticky;
      top: 100px;
    }
    .order-items {
      margin-bottom: 24px;
    }
    .order-item {
      display: flex;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .order-item:last-child {
      border-bottom: none;
    }
    .order-item-image {
      width: 80px;
      height: 80px;
    }
    .order-item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }
    .order-item-details {
      flex: 1;
    }
    .order-item-name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .order-item-brand {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .order-item-quantity {
      font-size: 12px;
      color: var(--text-light);
    }
    .order-item-price {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-dark);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .summary-row:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .summary-row.total {
      font-size: 20px;
      font-weight: bold;
      color: var(--text-dark);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px solid var(--border-color);
    }
    .payment-method-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .payment-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
    }
    .payment-option:hover {
      border-color: var(--primary-color);
    }
    .payment-option input[type="radio"] {
      margin: 0;
    }
    .payment-option input[type="radio"]:checked + label {
      font-weight: 600;
    }
    .payment-details {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
    @media (max-width: 968px) {
      .checkout-container {
        grid-template-columns: 1fr;
      }
      .order-summary {
        position: static;
      }
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <main>
    <section class="checkout-section">
      <div class="container">
        <h2 class="section-title" style="text-align: left;">Checkout</h2>
        <div class="checkout-container">
          <form id="order-form" class="checkout-form">
            <!-- Shipping Information -->
            <div class="form-section">
              <h3 class="form-section-title">Shipping Information</h3>
              <div class="form-group">
                <label class="form-label" for="name">Full Name *</label>
                <input type="text" id="name" name="name" class="form-input" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="email">Email Address *</label>
                <input type="email" id="email" name="email" class="form-input" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" class="form-input" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="address">Address *</label>
                <textarea id="address" name="address" class="form-input form-textarea" required></textarea>
              </div>
              <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px;">
                <div class="form-group">
                  <label class="form-label" for="city">City *</label>
                  <input type="text" id="city" name="city" class="form-input" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="state">State *</label>
                  <input type="text" id="state" name="state" class="form-input" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="pincode">Pincode *</label>
                  <input type="text" id="pincode" name="pincode" class="form-input" required>
                </div>
              </div>
            </div>

            <!-- Payment Information -->
            <div class="form-section">
              <h3 class="form-section-title">Payment Method</h3>
              <div class="payment-method-options">
                <div class="payment-option">
                  <input type="radio" id="card" name="payment-method" value="card" checked>
                  <label for="card">Credit/Debit Card</label>
                </div>
                <div class="payment-option">
                  <input type="radio" id="upi" name="payment-method" value="upi">
                  <label for="upi">UPI</label>
                </div>
                <div class="payment-option">
                  <input type="radio" id="cod" name="payment-method" value="cod">
                  <label for="cod">Cash on Delivery</label>
                </div>
              </div>
              <div class="payment-details" id="card-details">
                <div class="form-group">
                  <label class="form-label" for="card-number">Card Number *</label>
                  <input type="text" id="card-number" name="card-number" class="form-input" placeholder="1234 5678 9012 3456">
                </div>
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px;">
                  <div class="form-group">
                    <label class="form-label" for="expiry-date">Expiry Date *</label>
                    <input type="text" id="expiry-date" name="expiry-date" class="form-input" placeholder="MM/YY">
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="cvv">CVV *</label>
                    <input type="text" id="cvv" name="cvv" class="form-input" placeholder="123">
                  </div>
                </div>
              </div>
            </div>

            <div id="place-order-btn-container">
              <!-- Place Order button will be created dynamically -->
            </div>
          </form>

          <div class="order-summary">
            <h3 style="margin-bottom: 20px; font-size: 20px;">Order Summary</h3>
            <div id="order-items" class="order-items">
              <!-- Order items will be loaded dynamically -->
            </div>
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="order-subtotal">₹0</span>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <span id="order-shipping">₹0</span>
            </div>
            <div class="summary-row">
              <span>Tax (GST)</span>
              <span id="order-tax">₹0</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span id="order-total">₹0</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="js/pages/order.js"></script>
  <script>
    // Show/hide card details based on payment method
    document.addEventListener('DOMContentLoaded', () => {
      const paymentMethods = document.querySelectorAll('input[name="payment-method"]');
      const cardDetails = document.getElementById('card-details');
      
      paymentMethods.forEach(method => {
        method.addEventListener('change', () => {
          if (method.value === 'card') {
            cardDetails.style.display = 'block';
            cardDetails.querySelectorAll('input').forEach(input => input.required = true);
          } else {
            cardDetails.style.display = 'none';
            cardDetails.querySelectorAll('input').forEach(input => input.required = false);
          }
        });
      });
    });
  </script>
</body>
</html>
