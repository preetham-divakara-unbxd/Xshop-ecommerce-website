<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - XSHOP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .cart-section {
      margin: 40px 0;
    }
    .cart-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 40px;
    }
    #cart-container.empty-cart-container {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
    }
    .empty-state {
      text-align: center;
      max-width: 500px;
    }
    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .cart-item {
      display: flex;
      gap: 24px;
      padding: 24px;
      background: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      align-items: center;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .cart-item:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--primary-color);
    }
    .cart-item-image {
      flex-shrink: 0;
      width: 140px;
      height: 140px;
    }
    .cart-item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }
    .cart-item-content {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }
    .cart-item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cart-item-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 4px;
    }
    .cart-item-brand {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 8px;
    }
    .cart-item-price {
      font-size: 16px;
      color: var(--text-light);
      font-weight: 500;
    }
    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .cart-item-quantity {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-light);
      padding: 8px 12px;
      border-radius: 8px;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border-color);
      background: var(--bg-white);
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      color: var(--text-dark);
    }
    .qty-btn:hover {
      background: var(--primary-color);
      color: var(--bg-white);
      border-color: var(--primary-color);
    }
    .qty-input {
      width: 50px;
      height: 32px;
      text-align: center;
      border: none;
      background: transparent;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-dark);
    }
    .qty-input:focus {
      outline: none;
    }
    .cart-item-total {
      font-size: 20px;
      font-weight: bold;
      color: var(--text-dark);
      min-width: 100px;
      text-align: right;
    }
    .cart-item-actions {
      display: flex;
      align-items: center;
    }
    .btn-remove {
      width: 40px;
      height: 40px;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--danger-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      padding: 0;
    }
    .btn-remove:hover {
      background: var(--danger-color);
      color: var(--bg-white);
      border-color: var(--danger-color);
      transform: scale(1.05);
    }
    .btn-remove svg {
      width: 20px;
      height: 20px;
    }
    .cart-summary {
      background: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px;
      height: fit-content;
      position: sticky;
      top: 140px;
      box-shadow: var(--shadow-md);
    }
    .cart-summary h3 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--text-dark);
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 15px;
    }
    .summary-row:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .summary-row.total {
      font-size: 24px;
      font-weight: bold;
      color: var(--text-dark);
      margin-top: 8px;
      padding-top: 16px;
      border-top: 2px solid var(--border-color);
    }
    .summary-row span:last-child {
      font-weight: 600;
      color: var(--text-dark);
    }
    @media (max-width: 968px) {
      .cart-container {
        grid-template-columns: 1fr;
      }
      .cart-item {
        flex-direction: column;
        align-items: flex-start;
      }
      .cart-item-image {
        width: 100%;
        height: 200px;
      }
      .cart-item-content {
        flex-direction: column;
        width: 100%;
        align-items: flex-start;
      }
      .cart-item-controls {
        width: 100%;
        justify-content: space-between;
      }
      .cart-item-total {
        text-align: left;
      }
      .cart-summary {
        position: static;
      }
    }
    @media (max-width: 640px) {
      .cart-item-controls {
        flex-direction: column;
        gap: 16px;
        width: 100%;
      }
      .cart-item-quantity {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <main>
    <section class="cart-section">
      <div class="container">
        <h2 class="section-title" id="cart-title" style="text-align: left;">Shopping Cart</h2>
        <div class="cart-container">
          <div id="cart-container">
            <div id="cart-items" class="cart-items">
              <!-- Cart items will be loaded dynamically -->
            </div>
          </div>
          <div id="cart-summary" class="cart-summary">
            <h3 style="margin-bottom: 20px; font-size: 20px;">Order Summary</h3>
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="cart-subtotal">₹0</span>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <span id="cart-shipping">₹0</span>
            </div>
            <div class="summary-row">
              <span>Tax (GST)</span>
              <span id="cart-tax">₹0</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span id="cart-total">₹0</span>
            </div>
            <div id="checkout-btn-container" style="margin-top: 24px;">
              <!-- Checkout button will be created dynamically -->
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="js/pages/cart.js"></script>
</body>
</html>
