<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category - XSHOP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="header-container"></div>

  <main>
    <section class="products-section" style="margin-top: 40px;">
      <div class="container">
        <h2 class="section-title"><span id="category-name"></span></h2>
        <p id="products-count" style="margin-bottom: 24px; color: var(--text-light);"></p>
        <div id="products-container" class="products-grid">
          <!-- Products will be loaded dynamically -->
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="js/pages/category.js"></script>
</body>
</html>
