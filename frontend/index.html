<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XSHOP - Your Trusted Electronics Store</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="header-container"></div>

  <main>
    <!-- Hero Section -->
    <section class="hero-section">
      <div class="container">
        <div class="hero-container">
          <div class="hero-banner">
            <div class="hero-content">
              <h2>Phone/Iphone</h2>
              <h1>Iphone 14 Midnight</h1>
              <span class="hero-storage">128gb</span>
              <p class="hero-specs">
                OLED 6.1 inch, 2532 x 1170 pixel, A15 Bionic, 6-core CPU, 5-core GPU
              </p>
              <a href="category-results.html?category=Mobile phone" class="btn btn-primary">Shop Now</a>
            </div>
            <img src="https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=800&h=800&fit=crop&q=95&auto=format" alt="iPhone 14" id="hero-image">
            <div class="hero-banner-dots">
              <span class="hero-dot active"></span>
              <span class="hero-dot"></span>
              <span class="hero-dot"></span>
            </div>
          </div>
          <div class="promo-banners">
            <div class="promo-banner blue">
              <div>
                <div class="promo-label">Trade-In Offer</div>
                <div class="promo-title">Camera CCTV</div>
                <div class="promo-price">Starting from $75.00</div>
                <a href="category-results.html?category=Camera" class="btn btn-white btn-small">Shop Now</a>
              </div>
              <img src="https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04?w=500&h=500&fit=crop&q=95&auto=format" alt="CCTV Camera">
            </div>
            <div class="promo-banner yellow">
              <div>
                <div class="promo-label">Trade-In Offer</div>
                <div class="promo-title">Headphone</div>
                <div class="promo-price">Starting from $129.00</div>
                <a href="category-results.html?category=Headphone" class="btn btn-white btn-small">Shop Now</a>
              </div>
              <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&h=500&fit=crop&q=95&auto=format" alt="Headphone">
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Categories Section -->
    <section class="categories-section">
      <div class="container">
        <div id="categories-container" class="categories-grid">
          <!-- Categories will be loaded dynamically -->
        </div>
      </div>
    </section>

    <!-- New Arrivals Section -->
    <section class="products-section">
      <div class="container">
        <h2 class="section-title">New Arrivals</h2>
        <div class="filter-tabs-wrapper">
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="All">All</button>
            <button class="filter-tab" data-filter="Laptop">Laptop</button>
            <button class="filter-tab" data-filter="Mobile phone">Mobile phone</button>
            <button class="filter-tab" data-filter="Camera">Camera</button>
          </div>
        </div>
        <div id="products-container" class="products-grid">
          <!-- Products will be loaded dynamically -->
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
