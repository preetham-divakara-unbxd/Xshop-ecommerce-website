<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - XSHOP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .product-detail-section {
      margin: 40px 0;
    }
    .product-detail-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 40px;
    }
    .product-image-large {
      width: 100%;
      border-radius: 8px;
      box-shadow: var(--shadow-md);
    }
    .product-details h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: var(--text-dark);
    }
    .wishlist-btn {
      width: 48px;
      height: 48px;
      border: 2px solid var(--border-color);
      background: var(--bg-white);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      color: var(--text-light);
      flex-shrink: 0;
    }
    .wishlist-btn:hover {
      border-color: var(--danger-color);
      color: var(--danger-color);
      transform: scale(1.1);
    }
    .wishlist-btn.active {
      background: var(--danger-color);
      border-color: var(--danger-color);
      color: var(--bg-white);
    }
    .wishlist-btn svg {
      width: 24px;
      height: 24px;
    }
    .product-brand-name {
      font-size: 16px;
      color: var(--text-light);
      margin-bottom: 16px;
    }
    .product-rating-large {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .product-price-large {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .current-price-large {
      font-size: 32px;
      font-weight: bold;
      color: var(--text-dark);
    }
    .original-price-large {
      font-size: 20px;
      color: var(--text-light);
      text-decoration: line-through;
    }
    .discount-badge {
      background: var(--danger-color);
      color: var(--bg-white);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
    }
    .product-info-section {
      margin-bottom: 24px;
    }
    .product-info-section h3 {
      font-size: 16px;
      margin-bottom: 8px;
      color: var(--text-dark);
    }
    .product-info-section p {
      color: var(--text-light);
      line-height: 1.6;
    }
    .quantity-selector {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .qty-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border-color);
      background: var(--bg-white);
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .qty-btn:hover {
      background: var(--bg-light);
      border-color: var(--primary-color);
    }
    .qty-input {
      width: 60px;
      height: 40px;
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 16px;
    }
    @media (max-width: 768px) {
      .product-detail-container {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .product-details h1 {
        font-size: 24px;
      }
      .current-price-large {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <main>
    <section class="product-detail-section">
      <div class="container">
        <div class="product-detail-container">
          <div class="product-image-wrapper">
            <img id="product-image" src="" alt="Product" class="product-image-large">
          </div>
          <div class="product-details">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
              <h1 id="product-name" style="flex: 1; margin: 0;"></h1>
              <button id="wishlist-btn" class="wishlist-btn" title="Add to Wishlist">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </button>
            </div>
            <p class="product-brand-name" id="product-brand"></p>
            <div class="product-rating-large">
              <div id="product-rating"></div>
              <span id="product-reviews"></span>
            </div>
            <div class="product-price-large">
              <span class="current-price-large" id="current-price"></span>
              <span class="original-price-large" id="original-price" style="display: none;"></span>
              <span class="discount-badge" id="discount-badge" style="display: none;"></span>
            </div>
            <div class="product-info-section">
              <h3>Description</h3>
              <p id="product-description"></p>
            </div>
            <div class="product-info-section">
              <h3>Category</h3>
              <p id="product-category"></p>
            </div>
            <div class="product-info-section">
              <h3>Shipping</h3>
              <p id="product-shipping"></p>
            </div>
            <div class="quantity-selector">
              <label style="font-weight: 500;">Quantity:</label>
              <button class="qty-btn" id="decrease-qty">-</button>
              <input type="number" id="quantity" class="qty-input" value="1" min="1">
              <button class="qty-btn" id="increase-qty">+</button>
            </div>
            <div id="add-to-cart-container">
              <!-- Add to Cart button will be created dynamically -->
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="js/pages/product.js"></script>
</body>
</html>
